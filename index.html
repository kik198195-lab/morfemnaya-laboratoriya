:root{--ink:#27364f;--soft:#62718a;--line:#cfe2f3;--margin:#ef9a9a;--paper:#fffefa;--blue:#6bb7e8;--mint:#7ad7b8;--peach:#ffc29f;--yellow:#ffdc6b;--coral:#ff8e86;--lilac:#c3a8f0;
--p:#3b82f6;--r:#ef4444;--s:#22a565;--e:#f59e0b;--b:#8b5cf6;--title:'Segoe Print','Bradley Hand','Marker Felt','Comic Sans MS','Trebuchet MS',Verdana,sans-serif;--body:'Trebuchet MS','Segoe UI',Roboto,Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:clamp(13px,calc(.6vw + .75vh),22px)}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--body);color:var(--ink);background:#d9edf8;user-select:none;-webkit-user-select:none}
input,textarea{user-select:text;-webkit-user-select:text}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative;background:
linear-gradient(90deg,transparent 3.1rem,var(--margin) 3.1rem,var(--margin) calc(3.1rem + 2px),transparent calc(3.1rem + 2px)),
repeating-linear-gradient(180deg,var(--paper) 0,var(--paper) 2.05rem,var(--line) 2.05rem,var(--line) calc(2.05rem + 1px));perspective:1600px}
#top{display:flex;align-items:center;gap:.5rem;padding:.45rem .9rem .35rem 3.7rem;min-height:3.3rem;position:relative;z-index:5}
#top .ttl{font-family:var(--title);font-size:1.25rem;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stage{flex:1;min-height:0;overflow:auto;padding:.2rem 1.2rem .4rem 3.9rem;position:relative;touch-action:pan-y}
.screen{min-height:100%;display:flex;flex-direction:column;gap:.7rem;transform-origin:left center;animation:flip .42s cubic-bezier(.2,.75,.3,1)}
@keyframes flip{from{opacity:0;transform:rotateY(-24deg)}to{opacity:1;transform:none}}
.credit{padding:.12rem 1rem .22rem 3.9rem;font-size:.62rem;color:#9aa6b6;text-align:center;line-height:1.3}
.credit a{color:#8fa3bd;text-decoration:underline;touch-action:manipulation}
h1,h2,h3{font-family:var(--title);margin:0;line-height:1.2}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
.btn{border:0;border-radius:1.1rem;padding:.62rem 1.15rem;min-height:3rem;font-weight:700;font-size:1.02rem;color:#fff;background:linear-gradient(180deg,#70c1f0,#3f9ad9);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 .25rem 0 #2c79b0,0 .4rem .7rem rgba(44,121,176,.3);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(.2rem);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 .05rem 0 #2c79b0}
.btn:focus-visible,.tool:focus-visible,.opt:focus-visible,.seg button:focus-visible,.mcard:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
.btn.green{background:linear-gradient(180deg,#68d9a9,#2fb37c);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 .25rem 0 #1e8a5c,0 .4rem .7rem rgba(30,138,92,.3)}
.btn.coral{background:linear-gradient(180deg,#ff9f96,#f26d63);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 .25rem 0 #c94a41,0 .4rem .7rem rgba(201,74,65,.3)}
.btn.yellow{color:#6b4a00;background:linear-gradient(180deg,#ffe78d,#ffc93f);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 .25rem 0 #d79c10,0 .4rem .7rem rgba(215,156,16,.3)}
.btn.lilac{background:linear-gradient(180deg,#c9b2f3,#9b78e0);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 .25rem 0 #7253b6,0 .4rem .7rem rgba(114,83,182,.3)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px #cfe2f3,0 .15rem 0 #b9d3e8}
.btn[disabled]{opacity:.45;pointer-events:none}
.ico{min-width:2.7rem;min-height:2.7rem;padding:.25rem .55rem;font-size:.85rem;border:0;border-radius:.85rem;background:#fff;box-shadow:inset 0 0 0 2px #d6e7f5,0 .15rem 0 #bdd6ea;font-weight:700;display:inline-flex;align-items:center;gap:.3rem}
.ico svg{width:1.3rem;height:1.3rem}
.paper{background:#fff;border-radius:.45rem;padding:.8rem 1rem;box-shadow:0 .1rem .15rem rgba(60,90,120,.14),0 .5rem 1.1rem rgba(60,90,120,.12);position:relative}
.clip::before{content:"";position:absolute;top:-.7rem;right:1.8rem;width:1.05rem;height:2.5rem;border:.17rem solid #9db2c6;border-radius:.6rem;border-bottom-color:#7d94aa;transform:rotate(7deg)}
/* главная */
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1rem}
.hero h1{font-size:clamp(2.1rem,6.4vmin + 1rem,4.6rem);color:#29527e}
.hero p{font-size:1.2rem;margin:0;color:var(--soft);max-width:44rem}
.sample{width:min(42rem,92%);margin:.2rem 0}
.grades{display:flex;gap:1.1rem;flex-wrap:wrap;justify-content:center}
.grades .btn{font-family:var(--title);font-size:1.5rem;min-width:11rem;min-height:5rem}
/* меню */
.opts{display:flex;gap:.7rem 1.2rem;flex-wrap:wrap;align-items:center}
.opts label,.lbl{font-weight:700;font-size:.9rem;color:var(--soft)}
.seg{display:inline-flex;background:#eaf4fb;border-radius:.9rem;padding:.17rem;gap:.1rem;margin-left:.3rem;vertical-align:middle}
.seg button{border:0;background:none;border-radius:.75rem;min-height:2.5rem;min-width:2.5rem;padding:.15rem .7rem;font-weight:700;font-size:.92rem;color:var(--ink)}
.seg button.on{background:#fff;box-shadow:0 .1rem .3rem rgba(40,80,120,.25);color:#1d6fb0}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:.85rem;flex:1;grid-auto-rows:minmax(9rem,1fr)}
.mcard{border:0;text-align:left;background:#fff;border-radius:.55rem;padding:.65rem .8rem;display:flex;flex-direction:column;justify-content:center;gap:.25rem;box-shadow:0 .1rem .15rem rgba(60,90,120,.14),0 .55rem 1.1rem rgba(60,90,120,.13);transition:transform .15s;border-top:.42rem solid var(--c,#6bb7e8);min-height:9rem}
.mcard:nth-child(odd){transform:rotate(-.5deg)}.mcard:nth-child(even){transform:rotate(.4deg)}
.mcard:active{transform:scale(.97)}
.mcard svg{height:clamp(3.3rem,14vh,6.5rem);width:clamp(3.3rem,14vh,6.5rem)}
.mcard b{font-family:var(--title);font-size:1.2rem;line-height:1.2}
.mcard span{font-size:.92rem;color:var(--soft);line-height:1.25}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;flex:1;grid-auto-rows:minmax(7.5rem,1fr)}
.sgrid .mcard{position:relative;padding-left:3.1rem}.sgrid .mcard svg{height:clamp(2.8rem,9vh,4.6rem);width:clamp(2.8rem,9vh,4.6rem)}
.num{position:absolute;left:.7rem;top:.6rem;width:1.9rem;height:1.9rem;border-radius:50%;background:var(--c);color:#fff;font-family:var(--title);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:1.05rem}
.ggrid{display:grid;grid-template-columns:repeat(6,1fr);gap:.55rem}
.mcard.small{min-height:3.4rem;flex-direction:row;align-items:center;gap:.4rem;padding:.35rem .55rem;border-top-width:.3rem;transform:none}.mcard.small svg{height:2.2rem;width:2.2rem;flex:none}.mcard.small b{font-size:.85rem}
.rowgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,21rem),1fr));gap:.4rem .9rem;width:min(64rem,100%)}
.rowcell{display:flex;flex-direction:column;align-items:center;gap:.15rem;background:rgba(255,255,255,.7);border-radius:.6rem;padding:.2rem}
.board.wrongb svg{background:rgba(255,90,79,.08);border-radius:.6rem}
.cap2{font-size:.85rem;color:var(--soft);font-weight:700}
.chip.sm{min-height:2.2rem;font-size:.75rem;padding:.1rem .55rem}
.ask{font-size:1.3rem;font-weight:700;text-align:center;background:#fff;border-radius:.6rem;padding:.4rem 1rem;box-shadow:0 .2rem .5rem rgba(60,90,120,.12)}
.formrow.sm{font-size:1.2rem;color:#7a5a00}
.mlist{display:flex;flex-direction:column;gap:.45rem;width:min(30rem,100%)}
.mrow{display:flex;align-items:center;gap:.8rem;background:#fff;border-radius:.7rem;padding:.3rem .6rem;box-shadow:inset 0 0 0 2px #dbe9f5}.mrow b{flex:1;font-size:1.2rem}
.slot.msl{min-height:3.6rem;min-width:7rem;font-size:.8rem}.slot.okslot{border-style:solid;border-color:#2fb37c;background:#e3f8ee}
.piece.sign{background:#fff;box-shadow:inset 0 0 0 2px #dbe9f5,0 .22rem 0 #c2d9eb;padding:.25rem .6rem}.piece.sign svg{width:3.6rem;height:2.6rem}
.bboard{display:flex;flex-direction:column;gap:.5rem;width:100%;align-items:stretch}
.brow{display:flex;flex-wrap:wrap;gap:.3rem .6rem;justify-content:center;background:rgba(255,255,255,.55);border-radius:.7rem;padding:.25rem;box-shadow:inset 0 0 0 2px #e3eef8}
.bwords{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,19rem),1fr));gap:.4rem .7rem}
.rowcell.okc{background:#e3f8ee;box-shadow:inset 0 0 0 2px #2fb37c}.rowcell.badc{background:#fdecea;box-shadow:inset 0 0 0 2px #f26d63}
.bta{font:inherit;font-size:1.05rem;border:2px solid #cfe2f3;border-radius:.7rem;padding:.5rem .7rem;resize:vertical;color:var(--ink);user-select:text;-webkit-user-select:text}
.tools.stick{position:sticky;top:0;z-index:6;background:rgba(255,254,250,.94);padding:.25rem 0;border-radius:.8rem}
.note{font-size:.8rem;color:var(--soft)}
.board:has(>.fctx){position:relative}.fctx{position:absolute;left:0;right:0;top:0;text-align:center;font-size:clamp(.75rem,2vh,1.05rem);font-weight:700;color:#8a94b3;line-height:1;pointer-events:none;white-space:nowrap}
.sgrid{grid-template-columns:repeat(4,1fr)!important}
/* задание */
.tophead{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.task-title{font-family:var(--title);font-size:1.22rem;flex:1;min-width:13rem;line-height:1.25}
.prog{height:.75rem;background:#e8f1f8;border-radius:1rem;overflow:hidden;width:100%}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--blue));border-radius:1rem;transition:width .4s}
.counter{font-weight:700;font-size:.95rem;white-space:nowrap}
.star{color:#f5b301}
.body{flex:1;display:flex;flex-direction:column;gap:.7rem;justify-content:center;align-items:center;min-height:0}
.body>*{max-width:100%}
.actions{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;padding-bottom:.35rem}
.fb{min-height:2.4rem;text-align:center;font-size:1.02rem;font-weight:700;padding:.3rem .8rem;border-radius:.7rem;max-width:56rem;line-height:1.3}

  if(end&&rs!=null)s+=1;s+=extra||0;if(s>best.s){best.s=s;best.p=[...pre.map(x=>({t:'p',x})),...rootParts(root),...suf.map(x=>({t:'s',x})),end==='x'?{t:'e',x:'',none:1}:end?{t:'e',x:end}:{t:'e',x:'',zero:1}]}};
 const sufChains=(stem,list,depth,acc,cb)=>{cb(stem,acc);if(depth>=3)return;for(const x of list)if(stem.length>x.length+1&&stem.endsWith(x))sufChains(stem.slice(0,-x.length),list,depth+1,[x,...acc],cb)};
 const preChains=(stem,depth,acc,cb)=>{cb(stem,acc);if(depth>=2)return;for(const x of A_PREF)if(stem.length>x.length+1&&stem.startsWith(x))preChains(stem.slice(x.length),depth+1,[...acc,x],cb)};
 const run=(stem,end,fixed,list)=>preChains(stem,0,[],(rest,pre)=>sufChains(rest,list,0,[],(root,suf)=>consider(pre,root,[...suf,...fixed],end)));
 const vf=['ть','ти','чь'].find(x=>word.endsWith(x)&&word.length>3);
 if(vf){run(word.slice(0,-vf.length),'x',[vf],VERB_SUF)}
 else{const ends=A_END.filter(e=>word.endsWith(e)&&word.length-e.length>=2);if(!VOW.test(word.slice(-1))||word.endsWith('й'))ends.push('');ends.forEach(e=>run(e?word.slice(0,-e.length):word,e,[],A_SUF))}
 if(!best.p)return mk(word+' =0',0,0);
 const d=toDsl(best.p);const w=mk(d,0,0);const sufs=best.p.filter(p=>p.t==='s');
 if(sufs.length>=2&&!vf){const merged=[];let buf='';best.p.forEach(p=>{if(p.t==='s')buf+=p.x;else{if(buf){merged.push({t:'s',x:buf});buf=''}merged.push(p)}});w.alt=merged};
 w.auto=1;return w}
